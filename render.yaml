# Render.com — student budget: Neon Postgres (free) + local disk storage
services:
  - type: web
    name: interview-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEPLOY_PROFILE
        value: cloud
      - key: WHISPER_BACKEND
        value: openai
      - key: VECTOR_STORE
        value: chroma
      - key: EMBEDDING_BACKEND
        value: openai
      - key: DB_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: SKIP_VIDEO_STORAGE
        value: "true"
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma
      - key: LOCAL_STORAGE_DIR
        value: /tmp/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: interview-coach-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false

databases:
  - name: interview-coach-db
    plan: free
    databaseName: interview_coach
    user: interview
