services:
  - type: web
    name: interview-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: local
      - key: LLM_MODEL
        value: local
      - key: VECTOR_STORE
        value: chroma
      - key: STORAGE_BACKEND
        value: local
      - key: DB_ENABLED
        value: "false"
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://multimodal-ai-interview-coach.vercel.app
