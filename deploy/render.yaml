services:
  - type: web
    name: interview-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: VECTOR_STORE
        value: chroma
      - key: STORAGE_BACKEND
        value: local
      - key: DB_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://multimodal-ai-interview-coach.vercel.app
