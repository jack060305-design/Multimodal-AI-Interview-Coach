services:
  - type: web
    name: interview-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interview-coach-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: VECTOR_STORE
        value: chroma
      - key: STORAGE_BACKEND
        value: s3
      - key: DB_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://interview-coach-web.onrender.com

  - type: web
    name: interview-coach-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://interview-coach-api.onrender.com

databases:
  - name: interview-coach-db
    plan: free
